<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Compassionate fitness coaching that adapts to your life">

  <title>Alongside</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/images/logo-icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/logo-icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Alongside">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app" class="app-container">

    <!--
      Screen reader live region.
      Visually hidden — announces view changes to assistive technology
      (VoiceOver on iOS/macOS, TalkBack on Android, NVDA/JAWS on Windows).
      router.js writes a human-readable view name here after every navigate().
      aria-atomic="true" means the whole text is read, not just the changed part.
    -->
    <div
      id="sr-announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      class="sr-only"
      style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:0;">
    </div>

    <!--
      TTS status region.
      Announces "Playing" / "Stopped" to screen readers when the
      coach card speaker button is activated. Visually hidden.
    -->
    <div
      id="tts-status"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      class="sr-only"
      style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:0;">
    </div>

    <!-- Loading screen -->
    <div id="loading" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo">
          <img src="assets/images/logo-icon-192.png" alt="Alongside" width="128" height="128">
        </div>
        <h1 class="loading-title">Alongside</h1>
        <p class="loading-message" id="loading-message" aria-live="polite">
          Movement that meets you where you are
        </p>
        <div class="loading-spinner" aria-hidden="true"></div>
      </div>
    </div>

    <script>
      // Rotate coach messages on the loading screen.
      // Research-grounded, coach voice, never motivational-poster generic.
      const LOADING_MESSAGES = [
        "Research suggests that how we move in the morning shapes our mood for the next four hours.",
        "Even five minutes of movement changes the chemistry of how you feel.",
        "Consistency is not the same as intensity. Showing up quietly is enough.",
        "Your nervous system adapts to what you do most often. Every session matters.",
        "Rest is not the absence of progress. It is where adaptation happens.",
        "The body keeps the score \u2014 movement helps it release it.",
        "There is no such thing as a workout that was too short to count.",
        "How you feel before a session rarely predicts how you feel after it.",
        "Movement is not a punishment for what you ate. It is a gift to how you feel.",
        "The goal is not the perfect session. The goal is the next one.",
        "Your energy after movement is almost always higher than before it.",
        "Breathing is the one thing you do every moment. It is worth doing well.",
        "You do not need to earn rest. Rest is part of the programme.",
        "The body responds to what it is asked to do, not what it is told to do.",
        "Showing up on a low day is worth more than any high-energy session.",
        "Progress is not linear. Neither is life. The pattern matters more than any single day.",
        "The most effective workout is the one that fits today, not the one that fitted last week.",
        "You know your body better than any algorithm. Trust that.",
        "Pain is information. Movement is one of the best ways to read it.",
        "A five-minute walk is not a consolation prize. It is a real thing."
      ];
      const el = document.getElementById("loading-message");
      if (el) {
        const idx = (new Date().getMinutes() + new Date().getSeconds()) % LOADING_MESSAGES.length;
        el.textContent = LOADING_MESSAGES[idx];
      }
    </script>

    <!--
      Main content area.
      tabindex="-1" allows router.js to programmatically move focus here
      after each navigation, without making it part of the keyboard tab order.
    -->
    <main id="main-content" class="main-content" tabindex="-1"></main>

    <!-- Bottom navigation -->
    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Main navigation">
      <button class="nav-item active" data-view="coach-proposal" aria-label="Today">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-item" data-view="progress" aria-label="Progress">
        <span class="nav-icon" aria-hidden="true">📊</span>
        <span class="nav-label">Progress</span>
      </button>
      <button class="nav-item" data-view="settings" aria-label="Settings">
        <span class="nav-icon" aria-hidden="true">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!--
      Toast notifications.
      aria-live="polite" means screen readers announce toasts
      without interrupting whatever they're currently reading.
      aria-atomic="false" means only new toasts are read, not the whole container.
    -->
    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="false">
    </div>

    <!-- Feedback button -->
    <button id="feedback-fab" class="feedback-fab hidden" aria-label="Send feedback">
      <span aria-hidden="true">💬</span>
    </button>

    <!-- Modal container -->
    <div id="modal-container" class="modal-container hidden"></div>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
