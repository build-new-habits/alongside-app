<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Compassionate fitness coaching that adapts to your life">

  <title>Alongside</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/images/logo-icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/logo-icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Alongside">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app" class="app-container">

    <!--
      Screen reader live region.
      Visually hidden — announces view changes to assistive technology
      (VoiceOver on iOS/macOS, TalkBack on Android, NVDA/JAWS on Windows).
      router.js writes a human-readable view name here after every navigate().
      aria-atomic="true" means the whole text is read, not just the changed part.
    -->
    <div
      id="sr-announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      class="sr-only">
    </div>

    <!-- Loading screen -->
    <div id="loading" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo">
          <img src="assets/images/logo-icon-192.png" alt="Alongside" width="128" height="128">
        </div>
        <h1 class="loading-title">Alongside</h1>
        <p class="loading-subtitle">Movement that meets you where you are</p>
        <div class="loading-spinner" aria-hidden="true"></div>
      </div>
    </div>

    <!--
      Main content area.
      tabindex="-1" allows router.js to programmatically move focus here
      after each navigation, without making it part of the keyboard tab order.
    -->
    <main id="main-content" class="main-content" tabindex="-1"></main>

    <!-- Bottom navigation -->
    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Main navigation">
      <button class="nav-item active" data-view="intention" aria-label="Today">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-item" data-view="progress" aria-label="Progress">
        <span class="nav-icon" aria-hidden="true">📊</span>
        <span class="nav-label">Progress</span>
      </button>
      <button class="nav-item" data-view="settings" aria-label="Settings">
        <span class="nav-icon" aria-hidden="true">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!--
      Toast notifications.
      aria-live="polite" means screen readers announce toasts
      without interrupting whatever they're currently reading.
      aria-atomic="false" means only new toasts are read, not the whole container.
    -->
    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="false">
    </div>

    <!-- Feedback button -->
    <button id="feedback-fab" class="feedback-fab hidden" aria-label="Send feedback">
      <span aria-hidden="true">💬</span>
    </button>

    <!-- Modal container -->
    <div id="modal-container" class="modal-container hidden"></div>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
