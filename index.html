<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7B9E87">
  <title>Alongside</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- Loading screen -->
    <div id="loading" class="loading-screen">
      <h1>Alongside</h1>
      <p>Loading...</p>
    </div>
    
    <!-- Main content area -->
    <main id="main-content" class="main-content"></main>
    
    <!-- Bottom navigation (hidden until after onboarding) -->
    <nav id="bottom-nav" class="bottom-nav hidden">
      <button class="nav-item active" data-view="today">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-item" data-view="progress">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Progress</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>
    
    <!-- Toast notifications -->
    <div id="toast-container" class="toast-container"></div>
    
  </div>
  
  <script type="module" src="js/app.js"></script>
</body>
</html>
