<!-- index.html | 21 Jul 2026 v2 -->
<!--
  v2 — Persistent nav escape-hatch icon added (navfix-proposalloop
    session). A single small Home icon, fixed top-right, shown only on
    hideNavViews screens (toggled by router.js v9's _mountView()) and
    wired to session-guard.js v2's requestExit() in app.js v7. Styled
    inline here rather than in css/main.css — main.css was not
    ground-truthed this session, so styling for this new isolated
    element is self-contained to avoid a blind edit. Worth migrating
    into main.css later if Graeme wants it to use the shared design
    tokens instead.
  v1 — Sentry error monitoring wired in (Session A, item 1, DSN received).
    Loader script added to <head>, EU region confirmed (js-de.sentry-cdn.com).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Compassionate fitness coaching that adapts to your life">

  <title>Alongside</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/images/logo-icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/logo-icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Alongside">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">

  <!--
    Content-gated CSS — add these link tags when content sessions complete:
    D2:  <link rel="stylesheet" href="css/components/checkin-conversation.css">
    D3:  <link rel="stylesheet" href="css/components/home-threshold.css">
    D10: <link rel="stylesheet" href="css/components/community-impact.css">
    D8:  <link rel="stylesheet" href="css/components/annual-reflection.css">
  -->

  <!-- Sentry error monitoring — EU region (js-de = Frankfurt, Germany) -->
  <script
    src="https://js-de.sentry-cdn.com/87fc9709fbce818590bbe5dcaec01586.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- Nav escape-hatch icon styling — self-contained, see v2 changelog above -->
  <style>
    .hidden-nav-escape {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      right: calc(env(safe-area-inset-right, 0px) + 12px);
      z-index: 100;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: none;
      background: rgba(15, 23, 42, 0.55);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    .hidden-nav-escape:focus-visible {
      outline: 3px solid #5EEAD4;
      outline-offset: 2px;
    }
    .hidden-nav-escape.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app" class="app-container">

    <!--
      Screen reader live region.
      Visually hidden — announces view changes to assistive technology
      (VoiceOver on iOS/macOS, TalkBack on Android, NVDA/JAWS on Windows).
      router.js writes a human-readable view name here after every navigate().
      aria-atomic="true" means the whole text is read, not just the changed part.
    -->
    <div
      id="sr-announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      class="sr-only">
    </div>

    <!--
      TTS status region.
      Announces "Playing" / "Stopped" to screen readers when the
      coach card speaker button is activated. Visually hidden.
    -->
    <div
      id="tts-status"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      class="sr-only">
    </div>

    <!-- Loading screen -->
    <div id="loading" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo">
          <img src="assets/images/logo-icon-192.png" alt="Alongside" width="128" height="128">
        </div>
        <h1 class="loading-title">Alongside</h1>
        <p class="loading-subtitle">Movement that meets you where you are</p>
        <div class="loading-spinner" aria-hidden="true"></div>
      </div>
    </div>

    <!--
      Main content area.
      tabindex="-1" allows router.js to programmatically move focus here
      after each navigation, without making it part of the keyboard tab order.
    -->
    <main id="main-content" class="main-content" tabindex="-1"></main>

    <!-- Bottom navigation -->
    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Main navigation">
      <button class="nav-item active" data-nav="today" aria-label="Today" aria-current="page">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-item" data-nav="progress" aria-label="Progress">
        <span class="nav-icon" aria-hidden="true">📊</span>
        <span class="nav-label">Progress</span>
      </button>
      <button class="nav-item" data-nav="noticing" aria-label="Noticing">
        <span class="nav-icon" aria-hidden="true">🌿</span>
        <span class="nav-label">Noticing</span>
      </button>
      <button class="nav-item" data-nav="settings" aria-label="Settings">
        <span class="nav-icon" aria-hidden="true">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!--
      Toast notifications.
      aria-live="polite" means screen readers announce toasts
      without interrupting whatever they're currently reading.
      aria-atomic="false" means only new toasts are read, not the whole container.
    -->
    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="false">
    </div>

    <!-- Feedback button -->
    <button id="feedback-fab" class="feedback-fab hidden" aria-label="Send feedback">
      <span aria-hidden="true">💬</span>
    </button>

    <!-- Modal container -->
    <div id="modal-container" class="modal-container hidden"></div>

  </div>

  <!--
    Nav escape-hatch icon. Persistent, minimal way back to Today from any
    hideNavViews screen (intention, coach-proposal, coach-reflection, all
    session views, etc). Placed outside #app so position:fixed is never
    affected by a transform on an #app ancestor. Visibility toggled by
    router.js v9's _mountView(); click wired to session-guard.js v2's
    requestExit() in app.js v7 — routes through the same exit-confirmation
    guard as the back-gesture and Exit button during an active session,
    navigates straight to Today otherwise.
  -->
  <button
    id="hidden-nav-home-btn"
    class="hidden-nav-escape hidden"
    type="button"
    aria-label="Back to Today"
  >
    <span aria-hidden="true">🏠</span>
  </button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
